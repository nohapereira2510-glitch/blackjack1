<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blackjack</title>
  <meta name="description" content="Play Blackjack in your browser, powered by the Deck of Cards API." />
  <link rel="icon" href="https://deckofcardsapi.com/static/img/AS.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="signed-out">
  <section id="login-screen" class="login-screen" aria-labelledby="login-title">
    <div class="login-card">
      <div class="login-cards" aria-hidden="true">
        <img src="https://deckofcardsapi.com/static/img/AS.png" alt="" />
        <img src="https://deckofcardsapi.com/static/img/KH.png" alt="" />
      </div>
      <h1 id="login-title">Blackjack</h1>
      <p class="login-sub">Sign in to take a seat at the table.</p>
      <button id="google-btn" class="google-btn" type="button">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </div>
  </section>

  <header class="topbar">
    <h1>Blackjack</h1>
    <div id="user-chip" class="user-chip" hidden>
      <img id="user-avatar" class="avatar" alt="" referrerpolicy="no-referrer" hidden />
      <span id="user-initials" class="avatar initials" aria-hidden="true"></span>
      <span class="greeting">Welcome, <strong id="user-name"></strong></span>
      <button id="signout-btn" class="btn secondary small" type="button">Sign out</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">Bankroll</span><span id="bankroll" class="value">$1,000</span></div>
      <div class="stat"><span class="label">Bet</span><span id="bet" class="value">$0</span></div>
      <div class="stat"><span class="label">Shoe</span><span id="shoe" class="value">–</span></div>
    </div>
  </header>

  <main class="table">
    <section class="area dealer-area">
      <div class="area-head">
        <h2>Dealer</h2>
        <span id="dealer-total" class="total" hidden></span>
      </div>
      <div id="dealer-cards" class="cards"></div>
    </section>

    <div id="message" class="message" role="status" aria-live="polite">Place your bet to start.</div>

    <section class="area player-area">
      <div id="player-hands" class="hands"></div>
      <div class="area-head"><h2>You</h2></div>
    </section>
  </main>

  <footer class="controls">
    <div id="betting-controls" class="control-row">
      <div class="chips">
        <button class="chip chip-5" data-chip="5">5</button>
        <button class="chip chip-25" data-chip="25">25</button>
        <button class="chip chip-100" data-chip="100">100</button>
        <button class="chip chip-500" data-chip="500">500</button>
      </div>
      <div class="buttons">
        <button id="clear-btn" class="btn secondary">Clear</button>
        <button id="rebet-btn" class="btn secondary">Rebet</button>
        <button id="deal-btn" class="btn primary">Deal</button>
      </div>
    </div>

    <div id="play-controls" class="control-row" hidden>
      <div class="buttons">
        <button id="hit-btn" class="btn primary">Hit</button>
        <button id="stand-btn" class="btn primary">Stand</button>
        <button id="double-btn" class="btn secondary">Double</button>
        <button id="split-btn" class="btn secondary">Split</button>
      </div>
    </div>

    <div id="broke-controls" class="control-row" hidden>
      <div class="buttons">
        <button id="reset-btn" class="btn primary">Out of chips: start over with $1,000</button>
      </div>
    </div>

    <div id="retry-controls" class="control-row" hidden>
      <div class="buttons">
        <button id="retry-btn" class="btn primary">Retry dealer's turn</button>
      </div>
    </div>

    <p class="rules">6-deck shoe · Blackjack pays 3:2 · Dealer stands on all 17s · Double on any two cards · Split once</p>
    <p class="credit">Cards dealt by <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
